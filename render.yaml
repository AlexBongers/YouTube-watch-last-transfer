services:
  - type: web
    name: youtube-watch-later-transfer
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      # Optional: set these to persist credentials across server restarts.
      # If not set, use the in-app setup wizard at /setup to configure them.
      # - key: GOOGLE_CLIENT_ID
      #   sync: false
      # - key: GOOGLE_CLIENT_SECRET
      #   sync: false
